<meta charset="UTF-8"><!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku Game</title><style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f0f0}h1{text-align:center}#sudoku-board{border-collapse:collapse}#sudoku-board td{width:40px;height:40px;border:1px solid #000;text-align:center}input{width:100%;height:100%;text-align:center;font-size:18px}button{margin-top:20px;padding:10px 20px;font-size:16px}</style></head><body><h1>Sudoku Game</h1><table id="sudoku-board"></table><button onclick="checkSudoku()">Check Solution</button><script>let sudokuBoard=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];function renderBoard(){var e=document.getElementById("sudoku-board");e.innerHTML="";for(let r=0;r<9;r++){var t=document.createElement("tr");for(let e=0;e<9;e++){var d=document.createElement("td"),o=document.createElement("input");o.type="number",o.min="1",o.max="9",o.value=0===sudokuBoard[r][e]?"":sudokuBoard[r][e],o.disabled=0!==sudokuBoard[r][e],d.appendChild(o),t.appendChild(d)}e.appendChild(t)}}function checkSudoku(){let t=!0;for(let r=0;r<9;r++)for(let e=0;e<9;e++){var d=document.querySelector(`#sudoku-board tr:nth-child(${r+1}) td:nth-child(${e+1}) input`);if((d.value?parseInt(d.value):0)!==sudokuBoard[r][e]){t=!1;break}}t?alert("Congratulations! You solved the puzzle."):alert("Sorry, the solution is incorrect. Try again.")}renderBoard()</script></body></html>
